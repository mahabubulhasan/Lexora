<!DOCTYPE html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
    content="default-src 'self' blob:; script-src 'self'; style-src 'self' blob: 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data: *; frame-src blob: data:; object-src blob: data:; form-action 'none';">
<title>Lexora E-Book Reader</title>
<style>
    :root {
        --bg-color: #bbccaf;
        --text-color: #444c3c;
        --active-bg: rgba(68, 76, 60, 0.06);
		/* scrollbar colors: track aligned with bg, thumb a bit deeper */
		--scrollbar-track: rgba(187, 204, 175, 0.92); /* slightly darker/lighter mix of --bg-color */
		--scrollbar-thumb: rgba(68, 76, 60, 0.18);    /* deeper tone aligned with --text-color */
    }

    @supports (color-scheme: light dark) {
        @media (prefers-color-scheme: dark) {
            :root {
                /* keep same fixed palette regardless of system scheme */
                --active-bg: rgba(68, 76, 60, 0.06);
            }
        }
    }

    html {
        height: 100%;
        background: var(--bg-color);
        color: var(--text-color);
    }

    body {
        margin: 0 auto;
        height: 100%;
        font: menu;
        font-family: system-ui, sans-serif;
        background: transparent;
        color: inherit;
    }

	#drop-target {
		height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		text-align: center;
		visibility: hidden;
		/* larger copy in the drop area for better readability */
		font-size: 15px;
		line-height: 1.2;
	}

	#drop-target p:first-of-type {
		font-size: 18px;
	}

    #drop-target h1 {
        font-weight: 600;
    }

    #file-button {
        font: inherit;
        background: none;
        color: var(--text-color);
        border: 0;
        padding: 0;
        text-decoration: underline;
        cursor: pointer;
    }

    .icon {
        display: block;
        fill: none;
        stroke: currentcolor;
        stroke-width: 2px;
    }

    .empty-state-icon {
        margin: auto;
    }

    .toolbar {
        box-sizing: border-box;
        position: absolute;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 48px;
        padding: 6px 15px 6px 6px;
        transition: opacity 250ms ease;
        visibility: hidden;
    }

    .toolbar button {
        padding: 3px;
        border-radius: 6px;
        background: none;
        border: 0;
        color: GrayText;
    }

    .toolbar button:hover {
        background: rgba(0, 0, 0, .1);
        color: currentcolor;
    }

    #header-bar {
        top: 0;
    }

    #nav-bar {
        bottom: 0;
    }

    #progress-slider {
        flex-grow: 1;
        margin: 0 12px;
        visibility: hidden;
    }

    #side-bar {
        visibility: hidden;
        box-sizing: border-box;
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        height: 100%;
        width: 320px;
        transform: translateX(-320px);
        display: flex;
        flex-direction: column;
        background: var(--bg-color);
        color: var(--text-color);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 0 40px rgba(0, 0, 0, .2);
        transition: visibility 0s linear 300ms, transform 300ms ease;
    }

    #side-bar.show {
        visibility: visible;
        transform: translateX(0);
        transition-delay: 0s;
    }

    #dimming-overlay {
        visibility: hidden;
        position: fixed;
        z-index: 2;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, .2);
        opacity: 0;
        transition: visibility 0s linear 300ms, opacity 300ms ease;
    }

    #dimming-overlay.show {
        visibility: visible;
        opacity: 1;
        transition-delay: 0s;
    }

    #side-bar-header {
        padding: 1rem;
        display: flex;
        border-bottom: 1px solid rgba(0, 0, 0, .1);
        align-items: center;
    }

    #side-bar-cover {
        height: 10vh;
        min-height: 60px;
        max-height: 180px;
        border-radius: 3px;
        border: 0;
        background: lightgray;
        box-shadow: 0 0 1px rgba(0, 0, 0, .1), 0 0 16px rgba(0, 0, 0, .1);
        margin-inline-end: 1rem;
    }

    #side-bar-cover:not([src]) {
        display: none;
    }

    #side-bar-title {
        margin: .5rem 0;
        font-size: inherit;
    }

    #side-bar-author {
        margin: .5rem 0;
        font-size: small;
        color: GrayText;
    }

    #toc-view {
        padding: .5rem;
        overflow-y: scroll;
		/* Firefox */
		scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
		scrollbar-width: thin;
    }

    /* WebKit browsers */
    #toc-view::-webkit-scrollbar {
		width: 12px;
	}
	#toc-view::-webkit-scrollbar-track {
		background: var(--scrollbar-track);
	}
	#toc-view::-webkit-scrollbar-thumb {
		background: var(--scrollbar-thumb);
		border-radius: 8px;
		/* give thumb a slight inner gap so it visually sits above the track */
		border: 3px solid transparent;
		background-clip: padding-box;
	}

    #toc-view li,
    #toc-view ol {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    #toc-view a,
    #toc-view span {
        display: block;
        border-radius: 6px;
        padding: 8px;
        margin: 2px 0;
    }

    #toc-view a {
        color: var(--text-color);
        text-decoration: none;
    }

    #toc-view a:hover {
        background: var(--active-bg);
    }

    #toc-view span {
        color: GrayText;
    }

    #toc-view svg {
        margin-inline-start: -24px;
        padding-inline-start: 5px;
        padding-inline-end: 6px;
        fill: var(--text-color);
        cursor: default;
        transition: transform .2s ease;
        opacity: .5;
    }

    #toc-view svg:hover {
        opacity: 1;
    }

    #toc-view [aria-current] {
        font-weight: bold;
        background: var(--active-bg);
    }

    #toc-view [aria-expanded="false"] svg {
        transform: rotate(-90deg);
    }

    #toc-view [aria-expanded="false"]+[role="group"] {
        display: none;
    }

    .menu-container {
        position: relative;
    }

    .menu,
    .menu ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .menu {
        visibility: hidden;
        position: absolute;
        right: 0;
        background: var(--bg-color);
        color: var(--text-color);
        border-radius: 6px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 0 16px rgba(0, 0, 0, .1);
        padding: 6px;
        cursor: default;
    }

    .menu.show {
        visibility: visible;
    }

    .menu li {
        padding: 6px 12px;
        padding-left: 24px;
        border-radius: 6px;
    }

    .menu li:hover {
        background: var(--active-bg);
    }

    .menu li[aria-checked="true"] {
        background-position: center left;
        background-repeat: no-repeat;
        background-image: url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%2F%3E%3C%2Fsvg%3E');
    }

    .popover {
        background: var(--bg-color);
        color: var(--text-color);
        border-radius: 6px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 0 16px rgba(0, 0, 0, .1), 0 0 32px rgba(0, 0, 0, .1);
    }

    .popover-arrow-down {
        fill: var(--bg-color);
        filter: drop-shadow(0 -1px 0 rgba(0, 0, 0, .2));
    }

    .popover-arrow-up {
        fill: var(--bg-color);
        filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .2));
    }

	/* small hint shown under the drop-area controls */
	.drop-hint {
		margin-top: .5rem;
		color: GrayText;
		font-size: 14px;
	}
</style>
<input type="file" id="file-input" hidden>
